%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/qcom,sm8650-camera-icp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM8650 Camera Image Control Processor

maintainers:
  - Osilvfe <osilvfe@gmail.com>

description:
  The Camera Image Control Processor (ICP) schedules image processing jobs on
  the Qualcomm BPS and IPE hardware blocks. Its firmware is authenticated and
  started through the Qualcomm Peripheral Authentication Service.

properties:
  compatible:
    const: qcom,sm8650-camera-icp

  reg:
    items:
      - description: ICP control and status registers
      - description: ICP watchdog registers

  reg-names:
    items:
      - const: csr
      - const: watchdog

  interrupts:
    maxItems: 1

  interrupt-names:
    const: watchdog

  clocks:
    items:
      - description: ICP AHB clock
      - description: ICP source clock
      - description: ICP core clock
      - description: Camera debug XO clock
      - description: GCC camera AHB clock
      - description: GCC camera high-frequency AXI clock
      - description: GCC camera system-frequency AXI clock
      - description: Camera slow AHB source clock
      - description: Camera CPAS AHB clock
      - description: Camera CPAS core AHB clock
      - description: Camera driver AHB clock
      - description: Camera fast AHB source clock
      - description: Camera CPAS fast AHB clock
      - description: Camera NoC real-time AXI source clock
      - description: Camera NoC real-time AXI clock
      - description: Camera NoC non-real-time AXI clock
      - description: Camera driver XO clock
      - description: Camera PLL0

  clock-names:
    items:
      - const: icp_ahb
      - const: icp_src
      - const: icp
      - const: qdss
      - const: gcc_ahb
      - const: gcc_axi_hf
      - const: gcc_axi_sf
      - const: slow_ahb_src
      - const: cpas_ahb
      - const: cpas_core_ahb
      - const: drv_ahb
      - const: fast_ahb_src
      - const: cpas_fast_ahb
      - const: camnoc_axi_rt_src
      - const: camnoc_axi_rt
      - const: camnoc_axi_nrt
      - const: drv_xo
      - const: pll0

  interconnects:
    maxItems: 2

  interconnect-names:
    items:
      - const: ahb
      - const: memory

  iommus:
    minItems: 5
    maxItems: 5

  dma-coherent: true

  power-domains:
    maxItems: 1

  memory-region:
    items:
      - description: Reserved memory used to load the authenticated firmware
      - description: Reserved QDSS IOVA range
      - description: Reserved device-register IOVA range
      - description: Reserved firmware-uncached IOVA range
      - description: Global synchronization memory
      - description: Reserved shared buffer IOVA range

  memory-region-names:
    items:
      - const: firmware
      - const: qdss-iova
      - const: device-iova
      - const: uncached-iova
      - const: global-sync
      - const: shared-iova

  firmware-name:
    maxItems: 1
    description: Name of the MDT firmware metadata file

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - interconnects
  - interconnect-names
  - iommus
  - power-domains
  - memory-region
  - memory-region-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm8650-camcc.h>
    #include <dt-bindings/clock/qcom,sm8650-gcc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    remoteproc@ac01000 {
        compatible = "qcom,sm8650-camera-icp";
        reg = <0x0ac01000 0x1000>, <0x0ac04000 0x1000>;
        reg-names = "csr", "watchdog";
        interrupts = <GIC_SPI 463 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "watchdog";
        clocks = <&camcc CAM_CC_ICP_AHB_CLK>,
                 <&camcc CAM_CC_ICP_CLK_SRC>,
                 <&camcc CAM_CC_ICP_CLK>,
                 <&camcc CAM_CC_QDSS_DEBUG_XO_CLK>,
                 <&gcc GCC_CAMERA_AHB_CLK>,
                 <&gcc GCC_CAMERA_HF_AXI_CLK>,
                 <&gcc GCC_CAMERA_SF_AXI_CLK>,
                 <&camcc CAM_CC_SLOW_AHB_CLK_SRC>,
                 <&camcc CAM_CC_CPAS_AHB_CLK>,
                 <&camcc CAM_CC_CORE_AHB_CLK>,
                 <&camcc CAM_CC_DRV_AHB_CLK>,
                 <&camcc CAM_CC_FAST_AHB_CLK_SRC>,
                 <&camcc CAM_CC_CPAS_FAST_AHB_CLK>,
                 <&camcc CAM_CC_CAMNOC_AXI_RT_CLK_SRC>,
                 <&camcc CAM_CC_CAMNOC_AXI_RT_CLK>,
                 <&camcc CAM_CC_CAMNOC_AXI_NRT_CLK>,
                 <&camcc CAM_CC_DRV_XO_CLK>,
                 <&camcc CAM_CC_PLL0>;
        clock-names = "icp_ahb", "icp_src", "icp", "qdss",
                      "gcc_ahb", "gcc_axi_hf", "gcc_axi_sf",
                      "slow_ahb_src", "cpas_ahb", "cpas_core_ahb",
                      "drv_ahb", "fast_ahb_src", "cpas_fast_ahb",
                      "camnoc_axi_rt_src", "camnoc_axi_rt",
                      "camnoc_axi_nrt", "drv_xo", "pll0";
        interconnects = <&gem_noc 0 0 &config_noc 0 0>,
                        <&mmss_noc 1 0 &mc_virt 1 0>;
        interconnect-names = "ahb", "memory";
        iommus = <&apps_smmu 0x1820 0>,
                 <&apps_smmu 0x18c0 0>,
                 <&apps_smmu 0x1800 0>,
                 <&apps_smmu 0x1840 0>,
                 <&apps_smmu 0x1880 0>;
        power-domains = <&camcc CAM_CC_TITAN_TOP_GDSC>;
        memory-region = <&camera_mem>, <&camera_icp_qdss_iova>,
                        <&camera_icp_device_iova>,
                        <&camera_icp_uncached_iova>,
                        <&global_sync_mem>,
                        <&camera_icp_shared_iova>;
        memory-region-names = "firmware", "qdss-iova", "device-iova",
                              "uncached-iova", "global-sync",
                              "shared-iova";
        firmware-name = "qcom/sm8650/CAMERA_ICP.mbn";
        dma-coherent;
    };
...
