%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/invensense,icm42607.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: InvenSense ICM-42607 inertial measurement unit

maintainers:
  - InvenSense, Inc. <linux-iio@vger.kernel.org>

properties:
  compatible:
    enum:
      - invensense,icm42607
      - invensense,icm42607p

  reg:
    maxItems: 1

  vdd-supply: true
  vddio-supply: true

  mount-matrix:
    description: Optional 3x3 mounting rotation matrix.

  spi-max-frequency: true

required:
  - compatible
  - reg
  - vdd-supply
  - vddio-supply

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false
...
