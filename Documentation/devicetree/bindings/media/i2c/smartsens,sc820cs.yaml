%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc820cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC820CS CMOS image sensor

maintainers:
  - Osilvfe <osilvfe@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: smartsens,sc820cs

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xvclk

  reset-gpios:
    maxItems: 1

  dovdd-supply: true
  avdd-supply: true
  dvdd-supply: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false
...
